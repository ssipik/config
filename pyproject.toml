[project]
name = "rag-config"
version = "0.1.0"
description = "Shared configuration for the agentic RAG pipeline: sources and tuning parameters"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
