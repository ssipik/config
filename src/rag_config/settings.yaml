# Config variables — the shared services, and what the stages must agree on.
#
# Config, not model: changing one of these changes throughput or operations,
# never an answer. The model parameters are next door in parameters.yaml, and
# nothing appears in both. The reasoning behind each default lives in params.py,
# beside the dataclass.
#
# Credentials are deliberately absent: DSNs, API tokens and keys stay
# environment variables, because this file is committed and packaged. So is
# user_agent, which identifies a component rather than being shared.
#
# Any RAG_* variable still overrides an entry here for a single run.

qdrant_url: http://localhost:6333       # rerun: none
tei_url: http://localhost:8080          # rerun: none
tei_rerank_url: http://localhost:8081   # rerun: none
http_timeout: 30.0              # rerun: none
tei_timeout: 300.0              # rerun: none
rerank_timeout: 600.0           # rerun: none
qdrant_collection: rag_chunks   # rerun: stages 4-5 + agent redeploy
embed_batch_size: 8             # rerun: none, throughput only
rerank_batch_size: 32           # rerun: none, TEI's max-client-batch-size

# name ids of vectors in Qdrant
dense_vector: dense_bge_m3      # rerun: stages 4-5 + agent redeploy
sparse_vectors:                 # rerun: stages 4-5 + agent redeploy
  german: sparse_bm25_de
  english: sparse_bm25_en
batch_target_cost: 15000000     # rerun: stage 3
batch_max_docs: 200             # rerun: stage 3
default_doc_cost: 150000        # rerun: stage 3
default_cost_weight: 1.0        # rerun: stage 3
max_parse_error_rate: 0.2       # rerun: stage 6

# The agent's live knowledge sources (MCP servers). Empty list = corpus only.
# Per deployment, RAG_MCP_<NAME>_URL overrides url (e.g. RAG_MCP_BITBUCKET_URL).
mcp_servers:                    # rerun: agent redeploy
  - name: bitbucket
    url: http://localhost:3000/mcp
    description: >-
      Bitbucket workspace get-capital: source code, commits, branches and pull
      requests of the internal systems, including this RAG pipeline
      (repositories discover, delta, plan, parse_chunk, embed, finalize, agent,
      config).
    allowed_tools: [bb_get]     # read-only: never the bb_post/put/patch/delete tools
    web_url: https://bitbucket.org
  - name: nomad
    url: http://localhost:8080/mcp
    description: >-
      Nomad cluster: the live state of jobs, allocations, deployments, services
      and nodes, and the logs of running tasks — including this RAG pipeline's
      own services (rag-agent, qdrant, rag-postgres, tei-embed, tei-rerank,
      bitbucket-mcp, nomad-mcp).
    # reads that work on this cluster (reasons in params.py NOMAD_READ_TOOLS):
    # no writes, variables, ACL or Sentinel; no list_jobs (7,000+ jobs time
    # out), get_node (server bug) or raft peers/leader
    allowed_tools: [get_job, get_job_summary, get_job_allocations,
                    get_job_deployments, get_job_evaluations, get_job_services,
                    list_allocations, get_allocation, get_allocation_logs,
                    list_deployments, get_deployment, list_nodes,
                    list_namespaces, list_volumes, get_volume, list_regions]
    web_url: https://nomad-ui.service.get
