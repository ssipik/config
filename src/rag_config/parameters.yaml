# The model parameters every stage reads.
#
# Generated territory: the evaluation module emits an optimized set and it is
# blessed into this package under a new `version`. Values only, by design — the
# reasoning behind each default lives in params.py, where regenerating this file
# cannot destroy it.
#
# Model parameters only: chunking, embedding, retrieval, the LLM. Changing one
# changes what the pipeline retrieves or answers, so these are what a sweep
# varies and what a score belongs to. The config variables live next door in
# settings.yaml, and nothing appears in both.
#
# `rerun:` says what changing an entry costs, which is what an optimizer needs
# to know to plan a sweep. Anything absent here falls back to the dataclass
# defaults in params.py; any environment variable still overrides both.
#
# Credentials (DSNs, API tokens, keys) are deliberately not here: this file is
# committed and packaged. Nor is user_agent, which identifies a component
# rather than being shared.

version: v0-baseline

parse_chunk:
  chunk_size: 700                 # rerun: stages 4-5, words not tokens
  chunk_overlap: 100              # rerun: stages 4-5
  low_text_chars_per_page: 200    # rerun: stages 4-5

embed:
  dense_vector: dense_bge_m3      # rerun: stages 4-5 + agent redeploy
  sparse_vectors:                 # rerun: stages 4-5 + agent redeploy
    sparse_bm25_de: german
    sparse_bm25_en: english
  sparse_model_id: Qdrant/bm25    # rerun: stages 4-5 + agent redeploy
  sparse_avg_len: 256.0           # rerun: stages 4-5 + agent redeploy

agent:
  prefetch_limit: 30              # rerun: none
  top_k: 30                       # rerun: none
  rerank_top_n: 5                 # rerun: none
  rerank_enabled: false           # rerun: none
  rrf_k: 2                        # rerun: none
  rrf_dense_weight: 1.0           # rerun: none
  rrf_sparse_weight: 0.3333333333333333   # rerun: none
  truncate_chunks: false          # rerun: none
  max_excerpt_chars: 1500         # rerun: none
  llm_model: anthropic/claude-haiku-4.5   # rerun: none
  llm_temperature: 0.1            # rerun: none
  llm_max_tokens: 2048            # rerun: none
